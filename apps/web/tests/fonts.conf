<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Reproducible font environment for Playwright screenshot snapshots on the
     designated Ubuntu 24 delivery host: system fonts plus the Windows CJK
     faces the host mounts. Regenerate snapshots with
     FONTCONFIG_FILE=apps/web/tests/fonts.conf so committed pixels stay
     comparable across runs. CI runners use their own distro fonts; snapshot
     comparison there is best-effort and reported honestly when it drifts. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/mnt/c/Windows/Fonts</dir>
</fontconfig>
